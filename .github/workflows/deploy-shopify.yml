name: Deploy Shopify App

on:
  push:
    branches: [main]
    paths:
      - "shopify.app.toml"
      - "extensions/**"
      - ".github/workflows/deploy-shopify.yml"
      - "package.json"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify extension files exist
        run: |
          echo "=== Shopify CLI version ==="
          npx shopify version
          echo ""
          echo "=== Extension directory structure ==="
          find extensions/ -type f
          echo ""
          echo "=== Extension TOML ==="
          cat extensions/revoa-pixel/shopify.extension.toml
          echo ""
          echo "=== Block file ==="
          cat extensions/revoa-pixel/blocks/tracking_pixel.liquid
          echo ""
          echo "=== shopify.app.toml build config ==="
          grep -A5 '\[build\]' shopify.app.toml

      - name: Deploy Shopify app and extensions
        env:
          SHOPIFY_CLI_PARTNERS_TOKEN: ${{ secrets.SHOPIFY_CLI_PARTNERS_TOKEN }}
        run: npx shopify app deploy --force --verbose
